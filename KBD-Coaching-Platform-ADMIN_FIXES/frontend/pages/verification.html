<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KBD | Choose Account Type</title>

    <link
    rel="icon"
    type="image/png"
    href="/images/favicon.png?v=2"
>

    <link
        rel="stylesheet"
        href="../CSS/style.css"
    >

    <script src="../js/terms-guard.js"></script>
    
</head>

<body class="verification-body">

    <main class="verification-page">

        <section class="verification-panel">

            <img
                src="../images/kbd-logo.png"
                alt="KBD"
                class="verification-logo"
            >

            <p class="eyebrow">
                KBD COACHING PLATFORM
            </p>

            <h1>
                How will you use KBD?
            </h1>

            <p class="verification-introduction">
                Select your account type to continue to
                the appropriate sign-in or registration
                options.
            </p>

            <div class="role-selection-grid">

                <!-- COACH -->

                <button
                    class="role-selection-card"
                    type="button"
                    data-role="Coach"
                >
                    <span
                        class="role-selection-icon"
                        aria-hidden="true"
                    >
                        C
                    </span>

                    <strong>
                        I am a Coach
                    </strong>

                    <span>
                        Sign in to manage programmes,
                        participants, sessions and
                        coaching activities.
                    </span>
                </button>

                <!-- PARTICIPANT -->

                <button
                    class="role-selection-card"
                    type="button"
                    data-role="Participant"
                >
                    <span
                        class="role-selection-icon"
                        aria-hidden="true"
                    >
                        P
                    </span>

                    <strong>
                        I am a Participant
                    </strong>

                    <span>
                        Sign in or create an account to
                        access your coaching journey.
                    </span>
                </button>

            </div>

            <!-- PARTICIPANT OPTIONS -->

            <div
                id="participant-options"
                class="participant-entry-options hidden"
                aria-live="polite"
            >
                <p class="eyebrow">
                    PARTICIPANT ACCESS
                </p>

                <h2>
                    Continue as a Participant
                </h2>

                <div class="participant-option-buttons">

                    <a
                        href="login.html?role=Participant"
                        class="primary-button"
                    >
                        Participant Sign In
                    </a>

                    <a
                        href="register.html"
                        class="secondary-button"
                    >
                        Create Participant Account
                    </a>

                </div>

                <button
                    id="change-role-button"
                    class="text-button"
                    type="button"
                >
                    Choose a different account type
                </button>

            </div>

            <div
                id="verification-message"
                class="form-message"
                aria-live="polite"
            ></div>

            <div class="coach-access-request">
    <p>
        Interested in becoming a KBD Coach?
    </p>

    <a
        href="coach-request.html"
        class="secondary-button"
    >
        Request Coach Access
    </a>
</div>

        </section>

    </main>

    <script src="../js/verification.js"></script>

</body>

</html>
