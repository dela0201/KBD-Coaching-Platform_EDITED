<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KBD | Page Not Found</title>

    <link
    rel="icon"
    type="image/png"
    href="/images/favicon.png?v=2"
>

    <link
        rel="stylesheet"
        href="../CSS/style.css"
    >
</head>

<body class="error-page-body">

    <main class="error-page">

        <section class="panel error-page-panel">

            <a
                href="dashboard.html"
                class="error-page-logo"
                aria-label="KBD Dashboard"
            >
                <img
                    src="../images/kbd-logo.png"
                    alt="KBD"
                    class="brand-logo"
                >
            </a>

            <p class="eyebrow">
                ERROR 404
            </p>

            <h1>
                Page not found
            </h1>

            <p>
                The page you requested does not exist,
                may have moved, or is no longer available.
            </p>

            <div class="error-page-actions">

                <a
                    href="dashboard.html"
                    class="primary-button"
                >
                    Return to Dashboard
                </a>

                <button
    id="go-back-button"
    class="secondary-button"
    type="button"
>
    Go Back
</button>

            </div>

        </section>

    </main>

    <script src="../js/not-found.js"></script>

</body>

</html>
